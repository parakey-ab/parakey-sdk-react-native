def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["ParakeySdk_" + name]
}

def getExtOrIntegerDefault(name) {
  return getExtOrDefault(name).toString().toInteger()
}

// AGP 9 compiles Kotlin itself unless the app opts out with android.builtInKotlin=false,
// and applying kotlin-android on top of that fails the build.
def usesBuiltInKotlin() {
  def agpMajorVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
  def builtInKotlin = project.findProperty("android.builtInKotlin")
  return agpMajorVersion >= 9 && (builtInKotlin == null || builtInKotlin.toString().toBoolean())
}

apply plugin: "com.android.library"
if (!usesBuiltInKotlin()) {
  apply plugin: "kotlin-android"
}

android {
  namespace = "co.parakey.sdk.reactnative"

  compileSdk = getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdk = getExtOrIntegerDefault("minSdkVersion")
  }

  buildTypes {
    release {
      minifyEnabled = false
    }
  }

  lint {
    disable.add("GradleCompatible")
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  def parakeyUseControlUnit = (getExtOrDefault("useControlUnit")?.toString()?.toBoolean()) ?: false

  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation("co.parakey:${parakeyUseControlUnit ? 'sdk-control-unit' : 'sdk'}:2.13.8")
}
